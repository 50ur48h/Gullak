services:
  - type: web
    name: gullak
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: META_API_KEY
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: DEMO_MODE
        value: "true"
      - key: TZ
        value: Asia/Singapore
